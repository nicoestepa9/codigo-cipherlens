name: cryptoguard

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cryptoguard
      POSTGRES_USER: cryptoguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defini POSTGRES_PASSWORD en deploy/.env}
      TZ: ${TZ:-UTC}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cryptoguard -d cryptoguard"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    networks:
      - data

  backend:
    build:
      context: ..
      dockerfile: Dockerfile.server
    image: cryptoguard-server:local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENV: production
      DATABASE_URL: postgresql+psycopg://cryptoguard:${POSTGRES_PASSWORD:?}@db:5432/cryptoguard
      JWT_SECRET: ${JWT_SECRET:?defini JWT_SECRET en deploy/.env}
      CORS_ORIGINS: ${CORS_ORIGINS:?defini el origen exacto del frontend}
      COOKIE_SECURE: "true"
      EXPOSE_DOCS: "false"
      DISABLE_API_AUTH: "false"
      CLOUD_SCAN_BLOCK_PRIVATE: "true"
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-10}
      DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-30}
      DB_POOL_RECYCLE: ${DB_POOL_RECYCLE:-1800}
      MAX_CONCURRENT_SCANS: ${MAX_CONCURRENT_SCANS:-5}
      ALERTS_ENABLED: ${ALERTS_ENABLED:-true}
      AI_PROVIDER: ${AI_PROVIDER:-template}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      TZ: ${TZ:-UTC}
    expose:
      - "8000"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - edge
      - data

  caddy:
    image: caddy:2.8.4-alpine
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      CRYPTOGUARD_DOMAIN: ${CRYPTOGUARD_DOMAIN:?defini el dominio publico en deploy/.env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    security_opt:
      - no-new-privileges:true
    networks:
      - edge

volumes:
  pgdata:
  caddy_data:
  caddy_config:

networks:
  edge:
  data:
    internal: true
