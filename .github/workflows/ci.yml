name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (${{ matrix.database }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cipherlens/analisis
    strategy:
      fail-fast: false
      matrix:
        include:
          - database: sqlite
            database_url: sqlite://
          - database: postgresql
            database_url: postgresql+psycopg://cryptoguard:cryptoguard-test@127.0.0.1:5432/cryptoguard_test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cryptoguard_test
          POSTGRES_USER: cryptoguard
          POSTGRES_PASSWORD: cryptoguard-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cryptoguard -d cryptoguard_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: ${{ matrix.database_url }}
      ENV: dev
      ALERTS_ENABLED: "false"
      DISABLE_API_AUTH: "true"
      AI_PROVIDER: template
      JWT_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: cipherlens/analisis/pyproject.toml
      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[server,sslyze,ml]" pytest
      - name: Run backend tests
        run: python -m pytest -q tests

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cipherlens/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cipherlens/frontend/package-lock.json
      - name: Install frontend
        run: npm ci
      - name: Lint frontend
        run: npm run lint
      - name: Build frontend
        run: npm run build

  deploy-artifacts:
    name: Docker and Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build server image
        uses: docker/build-push-action@v6
        with:
          context: cipherlens/analisis
          file: cipherlens/analisis/Dockerfile.server
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Validate cloud compose
        working-directory: cipherlens/analisis
        env:
          POSTGRES_PASSWORD: ci-password
          JWT_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
          CORS_ORIGINS: https://app.example.com
          CRYPTOGUARD_DOMAIN: cryptoguard.example.com
        run: docker compose -f deploy/docker-compose.cloud.yml config --quiet
